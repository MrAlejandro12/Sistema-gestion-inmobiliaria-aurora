# ============================================================
# sonar-project.properties
# SGI-Aurora - Sistema de Gestion Inmobiliaria
# ============================================================
sonar.projectKey=Sistema-gestion-inmobiliaria-aurora
sonar.projectName=SGI-Aurora
sonar.projectVersion=2.0

# Source configuration
sonar.sources=.
sonar.language=php

# Exclusions - no analizar archivos de solo lectura o dependencias
sonar.exclusions=**/vendor/**,**/node_modules/**,**/*.min.js,**/*.min.css
sonar.test.exclusions=**/vendor/**

# PHP specific
sonar.php.version=8.0

# Coverage (currently 0% - future: add PHPUnit)
sonar.php.coverage.reportPaths=coverage.xml

# Duplication: exclude HTML templates in PHP (large inline HTML is expected)
sonar.cpd.exclusions=**/contrato_view.php,**/contrato_pdf.php

# Encoding
sonar.sourceEncoding=UTF-8
